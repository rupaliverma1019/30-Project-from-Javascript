<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Astrology Insight</h1>
    <form id="form">
        <label>Firstname</label>
        <input type="text" id="fname" name="fname" required>
        <label>Secondname</label>
        <input type="text" id="sname" name="sname" required>
        <label>Date of Birth(day)</label>
        <input type="number" id="date" name="date" min="1" max="31">
        <label>Month</label>
        <input type="number" id="month" name="month" min="1" max="12" required>
    
        <button type="submit">Get Insights</button>
        
    </form>
     <h2 id="content"></h2>
     <div  >
        <h2 id="Lnumber">Your Lucky Number:</h2>
        <h2 id="Lcolor">Your Lucky Color :</h2>
        <h2 id="positive">Your Positivity:</h2>
         <h2 id="negative">Your Negativity:</h2>
     </div>
    <script src="index.js"></script>
</body>
</html>
